env=QT_QPA_PLATFORM,Wayland;xcb
env=XCURSOR_SIZE,24
env=MOZ_ENABLE_WAYLAND,1
env=XDG_SESSION_TYPE,wayland
env = WLR_RENDERER,vulkan
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_WAYLAND_FRACTIONAL_SCALING,1
env = QT_QPA_PLATFORM,wayland
env = WLR_DRM_NO_MODIFIERS,1

exec-once = tide-island
exec-once = aww-daemon
exec-once = swaync
exec-once=polkit-gnome-authentication-agent-1
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store
exec-once=udiskie --automount --notify
