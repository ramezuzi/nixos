# environment + autostart for the mango session
# (sourced from config.conf; mirrors hyprland.lua autostart, minus ukishima)
env=QT_QPA_PLATFORM,wayland
env=XCURSOR_SIZE,20
env=MOZ_ENABLE_WAYLAND,1
env=XDG_SESSION_TYPE,wayland
env=GDK_SCALE,1
env=GDK_DPI_SCALE,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,0
env=QT_WAYLAND_FRACTIONAL_SCALING,1
env=WLR_RENDERER,vulkan
env=WLR_DRM_NO_MODIFIERS,1

# wallpaper daemon + idle — the same daemons hyprland.lua starts
exec_once=awww-daemon
exec_once=hypridle

# auth agent for polkit dialogs (binary comes from the polkit-gnome PATH wrapper)
exec_once=polkit-gnome-authentication-agent-1

# clipboard history + removable-media automount
exec_once=wl-paste --type text --watch cliphist store
exec_once=udiskie --automount --notify
