source=~./config/mango/env.conf
source=~./config/mango/rules.conf

# appearance
gappih=7
gappiv=7
gappoh=15
gappov=15
borderpx=0
rootcolor=0x1d2021ff
bordercolor=0x3c3836ff
focuscolor=0xd79921ff
urgentcolor=0xfb4934ff
maximizescreencolor=0x458588ff
scratchpadcolor=0xb16286ff
globalcolor=0x8ec07cff
overlaycolor=0xd3869bff
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# shadows
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=20
shadows_blur=30
shadowscolor=0x000000ff
border_radius=10
no_radius_when_single=0
no_border_when_single=0
focused_opacity=0.9
unfocused_opacity=0.8

# blur
blur=0
blur_layer=1
blur_params_radius=8
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=1
blur_params_contrast=1
blur_params_saturation=1.2
blur_optimized=0

# animations
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_open=300
animation_duration_close=300
animation_duration_move=200
animation_duration_tag=350
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
tearing=0
cursor_size=24

# per-tag layouts — keeping tag 3 as scroller and 4/9 as monocle rather than
# the all-tile version in your last paste, since that variation is functional,
# not accidental. Say if you actually want all nine flattened to tile instead.
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:monocle
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:monocle

# scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1

# master-stack layout
new_is_master=1
default_nmaster=1
default_mfact=0.5
smartgaps=0

# overview
enable_hotarea=1
hotarea_size=10
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# behavior
focus_on_activate=1
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
drag_tile_to_tile=1
axis_bind_apply_timeout=100

# keyboard — repeat rate only, layout deliberately not set here (see earlier note)
xkb_rules_layout=us
xkb_rules_variant=colemak_dh_ortho
xkb_rules_options=caps:escape
repeat_rate=30
repeat_delay=200
numlockon=0

# mouse
mouse_natural_scrolling=0

# apps
bind=ALT,Return,spawn,kitty
bind=SUPER+shift,return,spawn alacritty
bind=SUPER,d,spawn,rofi -show drun

# gaps
bind=ALT+SHIFT,equal,incgaps,1
bind=ALT+SHIFT,minus,incgaps,-1
bind=ALT+SHIFT,g,togglegaps

# focus movement
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# move / resize floating window
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50

# window states
bind=ALT,f,togglefullscreen
bind=ALT,a,togglemaximizescreen
bind=ALT,backslash,togglefloating
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverlay
bind=ALT,Tab,toggleoverview
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized
bind=ALT,z,toggle_scratchpad

# layout switching
bind=SUPER,n,switch_layout
bind=SUPER,comma,setlayout,tile
bind=SUPER,period,setlayout,tgmix
bind=SUPER,slash,setlayout,scroller
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset

# tags
bind=CTRL,1,view,1,0
bind=CTRL,2,view,2,0
bind=CTRL,3,view,3,0
bind=CTRL,4,view,4,0
bind=CTRL,5,view,5,0
bind=CTRL,6,view,6,0
bind=CTRL,7,view,7,0
bind=CTRL,8,view,8,0
bind=CTRL,9,view,9,0
bind=ALT,1,tagsilent,1,0
bind=ALT,2,tagsilent,2,0
bind=ALT,3,tagsilent,3,0
bind=ALT,4,tagsilent,4,0
bind=ALT,5,tagsilent,5,0
bind=ALT,6,tagsilent,6,0
bind=ALT,7,tagsilent,7,0
bind=ALT,8,tagsilent,8,0
bind=ALT,9,tagsilent,9,0
bind=ALT,bracketleft,viewtoleft,0
bind=ALT,bracketright,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# monitor
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER,bracketleft,focusmon,left
bind=SUPER,bracketright,focusmon,right

# screenshot
bind=SUPER+ALT,p,spawn,sh -c "grim -g \"$(slurp)\" - | wl-copy"

# volume / media keys
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind=SUPER,r,reload_config
bind=SUPER,m,quit
bind=SUPER+SHIFT,q,killclient

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=NONE,btn_left,toggleoverview,1

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# tide-island
bind=SUPER,Tab,spawn,tide-island-ipc call overview toggle
bind=SUPER,h,spawn,tide-island-ipc call tide swipeLeft
bind=SUPER,l,spawn,tide-island-ipc call tide swipeRight
bind=SUPER,j,spawn,tide-island-ipc call tide showClock
bind=SUPER,p,spawn,tide-island-ipc call tide togglePlayer
bind=SUPER,c,spawn,tide-island-ipc call tide toggleControlCenter
bind=SUPER,v,spawn,tide-island-ipc call tide toggleNotificationCenter
bind=SUPER,w,spawn,tide-island-ipc call tide toggleWallpaperPicker
bind=SUPER,a,spawn,tide-island-ipc call tide toggleApplicationLauncher
bind=SUPER,f,spawn,tide-island-ipc call island toggle

xwayland_ignore_scale = 120
monitorrule = name:DP-1, scale:1.50, scale_filter:nearest
