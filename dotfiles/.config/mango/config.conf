# mango session config — mirrors ~/.config/hypr/hyprland.lua
# (same look, input and SUPER-based binds; ukishima excluded for now)
#
# mango 0.18.x syntax. Check with: mango -p -c ~/.config/mango/config.conf
source=./env.conf
source=./rules.conf

# ── look: Hyprland gaps_in/out = 0, border_size = 0, rounding = 0 ──────────
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=0
gap_outer_vertical=0
smart_gaps=0

border_px=0
border_radius=0
no_radius_when_single=0
no_border_when_single=0

root_color=0x1d2021ff
border_color=0x3c3836ff
focus_color=0xd79921ff
urgent_color=0xfb4934ff
maximized_screen_color=0x458588ff
scratchpad_color=0xb16286ff
global_color=0x8ec07cff
overlay_color=0xd3869bff

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# ── no shadows / blur / dim / animations (Hyprland decoration) ─────────────
shadows=0
layer_shadows=0
blur=0
blur_layer=0
dim_enable=0
focused_opacity=1.0
unfocused_opacity=1.0
animations=0
layer_animations=0
allow_tearing=0

cursor_size=20

# ── layouts: Hyprland general.layout = scrolling → scroller on every tag ───
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# hyprland.lua scrolling layout: column_width = 1
scroller_structs=20
scroller_default_proportion=1.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1

# tile (master-stack) settings — used after cycling layouts with SUPER+h
new_is_master=1
default_master_factor=0.55
default_master_count=1

# overview
enable_hotarea=0
hotarea_size=10

# ── behavior: Hyprland follow_mouse = 1 (sloppy focus, no cursor warp) ─────
focus_on_activate=1
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
drag_tile_to_tile=1
axis_bind_apply_timeout=100

# ── keyboard: us / colemak_dh_ortho / caps:escape (same as Hyprland) ───────
xkb_rules_layout=us
xkb_rules_variant=colemak_dh_ortho
xkb_rules_options=caps:escape
repeat_rate=30
repeat_delay=200
numlock_on=0

# ── trackpad / mouse: Hyprland natural_scroll = false ──────────────────────
tap_to_click=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_natural_scrolling=0

xwayland_ignore_scale=120

# ═════════════════ binds (mainMod = SUPER, like Hyprland) ══════════════════
# NOTE: mango matches letter keysyms case-insensitively, so SUPER+E and
# SUPER+SHIFT+E are different chords only through the SHIFT modifier —
# exactly how hyprland.lua separates SUPER+E (focus down) from SUPER+E (dolphin).

# apps
bind=SUPER,Return,spawn,kitty
bind=SUPER+SHIFT,e,spawn,dolphin
bind=SUPER,r,spawn,rofi -show drun

# window state
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,quit
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglefullscreen,

# focus — colemak arrows (n = left, o = right, i = up, e = down)
bind=SUPER,n,focusdir,left
bind=SUPER,o,focusdir,right
bind=SUPER,i,focusdir,up
bind=SUPER,e,focusdir,down

# cycle layouts (Hyprland SUPER+H)
bind=SUPER,h,switch_layout

# workspaces/tags (Hyprland SUPER+num / SUPER+SHIFT+num; 9 tags)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# scratchpad (Hyprland SUPER+S special workspace)
bind=SUPER,s,toggle_scratchpad,

# dwindle split direction (Hyprland SUPER+J togglesplit)
bind=SUPER,j,dwindle_toggle_split_direction

# scroller column-width presets
bind=SUPER,p,switch_proportion_preset,

# move the focused window inside the tag (mango extra)
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# move / resize floating windows
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50

# tag navigation (mango extra; SUPER+n/o is focus in Hyprland)
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0

# monitor
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER,bracketleft,focusmon,left
bind=SUPER,bracketright,focusmon,right

# screenshot (same grim+slurp+wl-copy pipeline)
bind=SUPER+ALT,p,spawn,sh -c "grim -g \"$(slurp)\" - | wl-copy"

# overview (no Hyprland equivalent)
bind=ALT,Tab,toggleoverview,

# reload config (SUPER+R is the launcher, so this moved off of it)
bind=SUPER+CTRL,r,reload_config

# neutralize mango's default SUPER+m quit (Hyprland binds nothing there)
bind=SUPER,m,centerwin

# volume / brightness / media keys (same commands as hyprland.lua)
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=none,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bind=none,XF86AudioNext,spawn,playerctl next
# (XF86AudioPause and XF86AudioPlay resolve to the same key, so only one is bound)
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioPrev,spawn,playerctl previous

# mouse (Hyprland mainMod + LMB/RMB drag/resize)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# scroll through workspaces (Hyprland SUPER+mouse_down/up)
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# 3-finger horizontal swipe switches tags (Hyprland workspace gesture)
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client
