# window/layer rules for the mango session (mango 0.18.x syntax, sourced
# from config.conf). Blur and animation rules from the old config are gone:
# this setup runs with blur=0 and animations=0 like Hyprland.

# keep mpv and thunar as overlay-style floating windows
window_rule=is_floating:1,is_overlay:1,app_id:mpv
window_rule=is_floating:1,is_overlay:1,app_id:thunar

# Hyprland hyprland.lua equivalent: ignore app-requested maximize events
window_rule=ignore_maximize:1,app_id:.*

# Hyprland fix for XWayland drag issues: never focus the 1x1 helper windows
window_rule=no_focus:1,app_id:^$,title:^$
